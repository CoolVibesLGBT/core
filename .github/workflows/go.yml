name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: databasename
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: host=localhost port=5432 user=postgres password=password dbname=databasename sslmode=disable
      ENV: test
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.3'

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            pg_isready -h localhost -U postgres && break
            sleep 2
          done

      - name: Download dependencies
        run: go mod tidy

      - name: Run migrations
        run: go run . --migrate

      - name: Run seed
        run: go run . --seed
        
      - name: Lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b ./bin v2.12.2
          ./bin/golangci-lint run ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...