name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: databasename
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: host=localhost port=5432 user=postgres password=password dbname=databasename sslmode=disable
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'

      - name: Wait for Postgres
        run: sleep 5

      - name: Run migrations
        run: go run . --migrate

      - name: Run seed
        run: go run . --seed

      - name: Test
        run: go test -v ./...

      - name: Download dependencies
        run: go mod tidy
      
      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...